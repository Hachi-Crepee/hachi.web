<div class="cadastroBody">

    <div class="cardCadastro">
        <h1>Criar Conta</h1>
        <h2>Junte-se à família Hachi e ganhe vantagens exclusivas</h2>

        <form class="formCadastro" action="cadastro.html" method="post" id="form">
            <div class="formulario"> 
                <div>
                    <h4>Nome completo</h4>
                    <input class="cadastroInputs" type="text" name="nome" id="nomeCompleto" placeholder="Nome Completo">
                    <h4>Email <b>*</b></h4>
                    <input class="cadastroInputs" type="email" name="email" id="email" placeholder="Email" required>
                </div>
                <div class="senhas">
                    <h4>Senha <b>*</b></h4>
                    <input class="cadastroInputs" type="password" name="senha" id="senha" placeholder="Senha" required>
                    <h4>Confirmar Senha <b>*</b></h4>
                    <input class="cadastroInputs" type="password" name="confirmarSenha" id="confirmarSenha"
                        placeholder="Confirmar Senha"
                        required>
                </div>
            </div>
            <div class="usuarioTermos">
                <input type="checkbox" id="termos">
                <label for="termos">Li e aceito os <a href="termos.html" target="_blank">Termos de Uso e Privacidade</a></label>
            </div>
            <div class="usuarioTermos">
                <input type="checkbox" id="ofertas">
                <label for="ofertas">Quero receber ofertas e novidades por e-mail</label>
            </div>
            <button type="submit" id="cadastro">Criar Minha Conta</button>
        </form>
        <div class="cadastroDivisao">
            <hr>
            <span>ou</span>
            <hr>
        </div>
        <h6 class="jaTemConta">Já tem uma Conta? <a href="login.html">Login</a></h6>
    </div>
</div>


<div id="mensagem">
</div>

<script>
    let form = document.getElementById('form');

    function validarEmail(email) {
        let regex = /\S+@\S+\.\S+/;
        return regex.test(email);
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let nomeCompleto = document.getElementById('nomeCompleto').value.trim();
        let email = document.getElementById('email').value.trim().toLowerCase();
        let senha = document.getElementById('senha').value;
        let confirmarSenha = document.getElementById('confirmarSenha').value;

        if (nomeCompleto === "" || email === "" || senha === "" || confirmarSenha === "") {
            notificacao("Inválido", "Campos não pode ser vazios!");
            return;
        }

        if (senha !== confirmarSenha) {
            notificacao("Inválido!", "Senha é diferente de confirmação.");
            return;
        }

        if (!validarEmail(email)) {
            notificacao("Inválido!", "E-mail no formato inválido!");
            return;
        }

        if (nomeCompleto.length === 0 || nomeCompleto.length < 3) {
            notificacao("Inválido!", "Verifique o nome!");
            return;
        }

        const dadosCadastro = {
            nomeCompleto: nomeCompleto,
            email: email,
            senha: senha,
            confirmarSenha: confirmarSenha
        }

        cadastro(dadosCadastro);
    })

    function cadastro(dadosCadastro) {

        fetch("http://localhost:8080/usuarios", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeCompleto: dadosCadastro.nomeCompleto,
                email: dadosCadastro.email,
                senha: dadosCadastro.senha,
                confirmarSenha: dadosCadastro.confirmarSenha,
            })
        }).then((res) => {
            if (res.status === 409) {
                notificacao("Ops!", "Usuário já cadastrado. Faça login.");
                return null;
            }

            if (!res.ok) {
                notificacao("Ops!", "Ocorreu um erro. Tente novamente.");
                return null;
            }

            if (res.status === 201) {
                notificacao("Sucesso", "Conta criada com sucesso!");
                window.location.href = "/login.html";
            }

            console.log(res.json());
            return res.json();
        }).then((dados) => {
            console.log(dados);
        }).catch((err) => {
            console.error(err)
            notificacao("Ops!", "Ocorreu um erro. Tente novamente!");
            throw new Error("Erro: " + err);
        });
    }

    function notificacao(titulo, mensagem) {
        let html = `
            <div class="corpo">
                <span class="titulo">${titulo}</span>
                <p class="conteudo">${mensagem}</p>
            </div>
            `;

        document.getElementById('mensagem').style.display = 'flex';
        document.getElementById('mensagem').innerHTML = html;
    }
</script>
</body>
