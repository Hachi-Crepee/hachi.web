        <div class="cardCadastro">
            <h1>Entrar</h1>
            <h2>Acesse sua conta e continue pedindo</h2>

            <form class="formCadastro" id="form" method="post">
                <h4>Email <b>*</b></h4>
                <input class="cadastroInputs" type="email" name="email" id="email" placeholder="Email" required>
                <h4>Senha <b>*</b></h4>
                <input class="cadastroInputs" type="password" name="senha" id="senha" placeholder="Senha" required>
                <a href="cadastro.html" class="esqueceuSenha">Esqueceu sua Senha?</a>
                <button type="submit">Entrar</button>
            </form>
            <div class="cadastroDivisao">
                <hr>
                <span>ou</span>
                <hr>
            </div>
            <h6 class="jaTemConta">Não tem uma Conta? <a href="cadastro.html">Cadastre-se</a></h6>
        </div>
    </div>

    <div id="mensagem"></div>

<script>

    let form = document.getElementById('form');

    function validarEmail(email) {
        let regex = /\S+@\S+\.\S+/;
        return regex.test(email);
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        let email = document.getElementById('email').value.trim().toLocaleLowerCase();
        let senha = document.getElementById('senha').value;

        if (email === "" || !validarEmail(email)) {
            notificacao("Inválido", "E-mail inválido!");
            return null;
        }

        if (senha === "") {
            notificacao("Inválido", "Senha inválida!");
            return null;
        }

        const dadosLogin = {
            email: email,
            senha: senha
        }

        login(dadosLogin);
    })

    function notificacao(titulo, mensagem) {
        let html = `
            <div class="corpo">
                <span class="titulo">${titulo}</span>
                <p class="conteudo">${mensagem}</p>
            </div>
            `;

        document.getElementById('mensagem').style.display = 'flex';

        document.getElementById('mensagem').innerHTML = html;
    }

    function login(dadosLogin) {

        fetch('http://localhost:8080/usuarios/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              email: dadosLogin.email,
              senha: dadosLogin.senha
            })
        }).then((res) => {
            if (res.status !== 200) {
                notificacao("Ops!", "Ocorreu um erro. Tente novamente.");
                return null;
            }

            return res.json();
        }).then((dados) => {
            console.log(dados);
            if (!dados) {
                return;
            }

            const usuario = {
                id: dados.idUsuario,
                nome: dados.nomeCompleto,
                email: dados.email,
            }

            sessionStorage.setItem('usuario', JSON.stringify(usuario));
            notificacao("Sucesso!", "Autenticado com sucesso!");
        }).catch((err) => {
            console.error(err);
            notificacao("Ops!", "Ocorreu um erro. Tente novamente!");
            throw new Error("Erro: " + err);
        })
    }
</script>
</body>

</html>
